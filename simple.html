<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最简单测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      padding: 20px;
    }
    .level-content {
      background: #16213e;
      padding: 20px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #00d4ff;
    }
    pre {
      background: #0f0f1a;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
    }
    ul {
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <h1>最简单测试页面</h1>
  
  <!-- 直接显示关卡内容，不需要JavaScript -->
  <div class="level-content">
    <div class="level-header">
      <div class="level-phase-badge">新手村</div>
      <h2 class="level-title">关卡 1: 初识Python</h2>
      <p class="level-description">学习如何输出文字到屏幕，开始你的Python之旅！</p>
    </div>
    <div class="learning-objectives">
      <h3>📚 学习目标</h3>
      <ul>
        <li>了解Python的基本语法结构</li>
        <li>学会使用print()函数</li>
        <li>理解字符串的概念</li>
      </ul>
    </div>
    <div class="code-example">
      <pre># 输出文字
print("Hello, World!")
print("欢迎来到编程世界！")</pre>
    </div>
    <div class="challenge">
      <h3>🎯 挑战任务</h3>
      <p>编写一个程序，输出"你好，Python！"和"我准备好了！"这两句话。</p>
    </div>
  </div>
</body>
</html>
