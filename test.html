<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试页面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      padding: 20px;
    }
    .debug {
      background: #252542;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .success { color: green; }
    .error { color: red; }
    .level-content {
      background: #16213e;
      padding: 20px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #00d4ff;
    }
  </style>
</head>
<body>
  <h1>测试页面</h1>
  
  <div class="debug" id="debugLog"></div>
  
  <div id="levelContent">
    <!-- 关卡内容将在这里显示 -->
  </div>

  <script>
    const GameState = {
      completedLevels: [],
      currentLevel: 1,
      currentPhase: 1,
      levelsData: [],
      modeStates: {}
    };

    function log(msg, type = 'info') {
      const logDiv = document.getElementById('debugLog');
      const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'white';
      logDiv.innerHTML += `<p style="color: ${color}">${msg}</p>`;
    }

    async function loadLevelsData() {
      try {
        log('开始加载关卡数据...');
        const response = await fetch('data/levels.json');
        if (!response.ok) {
          throw new Error('Failed to load levels data');
        }
        
        const data = await response.json();
        GameState.levelsData = data.levels;
        log(`✅ 关卡数据加载成功: ${GameState.levelsData.length} 个关卡`, 'success');
        
        generateLevelContent();
      } catch (error) {
        log(`❌ 加载失败: ${error.message}`, 'error');
        console.error('Error:', error);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function generateLevelContent() {
      const contentContainer = document.getElementById('levelContent');
      log(`📦 contentContainer: ${contentContainer ? '存在' : '不存在'}`, contentContainer ? 'success' : 'error');
      
      if (!contentContainer) return;
      
      contentContainer.innerHTML = '';
      log(`📋 开始生成关卡内容，共 ${GameState.levelsData.length} 个关卡`);
      
      GameState.levelsData.slice(0, 3).forEach(level => {
        log(`📝 生成关卡 ${level.id}: ${level.title}`);
        
        const levelDiv = document.createElement('div');
        levelDiv.className = 'level-content';
        levelDiv.id = 'level' + level.id;
        
        const objectivesList = level.objectives.map(obj => `<li>${escapeHtml(obj)}</li>`).join('');
        
        levelDiv.innerHTML = `
          <h2>🎮 ${escapeHtml(level.title)}</h2>
          <p>${escapeHtml(level.description)}</p>
          <h3>📚 学习目标</h3>
          <ul>${objectivesList}</ul>
          <h3>💡 示例代码</h3>
          <pre>${escapeHtml(level.example)}</pre>
          <h3>🎯 挑战任务</h3>
          <p>${escapeHtml(level.challenge)}</p>
        `;
        
        contentContainer.appendChild(levelDiv);
      });
      
      log('✅ 关卡内容生成完成', 'success');
    }

    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', loadLevelsData);
  </script>
</body>
</html>
