<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静态测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      padding: 20px;
    }
    .level-content-wrapper {
      background: #1a1a2e;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid rgba(0, 212, 255, 0.1);
      min-height: 500px;
    }
    .level-content {
      display: block;
      animation: fadeIn 0.4s ease-out;
    }
    .level-header {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, #00d4ff, #7c3aed) 1;
    }
    .level-phase-badge {
      display: inline-block;
      padding: 6px 14px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      color: white;
      border-radius: 8px;
      font-size: 0.85em;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .level-title {
      font-size: 2em;
      font-weight: 700;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .level-description {
      color: #a0a0b0;
      font-size: 1.1em;
      line-height: 1.7;
    }
    .learning-objectives {
      background: rgba(0, 212, 255, 0.05);
      border-left: 4px solid #00d4ff;
      padding: 24px;
      border-radius: 0 12px 12px 0;
      margin-bottom: 28px;
    }
    .learning-objectives h3 {
      color: #00d4ff;
      font-size: 1.2em;
      margin-bottom: 16px;
    }
    .code-example pre {
      background: #0f0f1a;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      color: #e8e8e8;
    }
    .challenge h3 {
      color: #10b981;
      font-size: 1.2em;
      margin-bottom: 16px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>静态测试页面</h1>
  
  <div class="level-content-wrapper">
    <div class="level-content">
      <div class="level-header">
        <div class="level-phase-badge">新手村</div>
        <h2 class="level-title">关卡 1: 初识Python</h2>
        <p class="level-description">学习如何输出文字到屏幕，开始你的Python之旅！</p>
      </div>
      <div class="learning-objectives">
        <h3>📚 学习目标</h3>
        <ul>
          <li>了解Python的基本语法结构</li>
          <li>学会使用print()函数</li>
          <li>理解字符串的概念</li>
        </ul>
      </div>
      <div class="code-example">
        <pre># 输出文字
print("Hello, World!")
print("欢迎来到编程世界！")</pre>
      </div>
      <div class="challenge">
        <h3>🎯 挑战任务</h3>
        <p>编写一个程序，输出"你好，Python！"和"我准备好了！"这两句话。</p>
      </div>
    </div>
  </div>
</body>
</html>
