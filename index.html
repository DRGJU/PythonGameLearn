<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Python游戏化学习平台 - 以沉浸式游戏体验学习Python编程，从基础到进阶">
  <meta name="keywords" content="Python, 编程学习, 游戏化学习, Python教程">
  <meta name="author" content="Python Game Learn">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="robots" content="index, follow">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <title>Python 游戏化学习平台</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" as="style">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preload" href="css/style.css" as="style">
  <link rel="stylesheet" href="css/style.css">
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('loaded');
    });
  </script>
</head>
<body>

  <header class="hero-header">
    <div class="container header-content">
      <div class="logo-section">
        <div class="python-icon">
          <svg width="48" height="48" viewBox="0 0 256 255" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="python-gradient" x1="12.959%" y1="12.039%" x2="79.639%" y2="78.201%">
                <stop offset="0%" stop-color="#387EB8"/>
                <stop offset="100%" stop-color="#366994"/>
              </linearGradient>
              <linearGradient id="python-gradient-2" x1="19.128%" y1="20.579%" x2="90.742%" y2="88.429%">
                <stop offset="0%" stop-color="#FFE052"/>
                <stop offset="100%" stop-color="#FFC331"/>
              </linearGradient>
            </defs>
            <path d="M126.916.072c-64.832 0-60.784 28.115-60.784 28.115l.072 29.128h61.868v8.745H41.631S.145 61.355.145 126.77c0 65.417 36.21 63.097 36.21 63.097h21.61v-30.356s-1.165-36.21 35.632-36.21h61.362s34.475.557 34.475-33.319V33.97S194.67.072 126.916.072zM92.802 19.66a11.12 11.12 0 0 1 11.13 11.13 11.12 11.12 0 0 1-11.13 11.13 11.12 11.12 0 0 1-11.13-11.13 11.12 11.12 0 0 1 11.13-11.13z" fill="url(#python-gradient)"/>
            <path d="M128.757 254.126c64.832 0 60.784-28.115 60.784-28.115l-.072-29.127H127.601v-8.745h86.441s41.486 4.705 41.486-60.712c0-65.416-36.21-63.096-36.21-63.096h-21.61v30.355s1.165 36.21-35.632 36.21h-61.362s-34.475-.557-34.475 33.32v56.013s-5.235 33.897 62.518 33.897zm34.114-19.586a11.12 11.12 0 0 1-11.13-11.13 11.12 11.12 0 0 1 11.13-11.13 11.12 11.12 0 0 1 11.13 11.13 11.12 11.12 0 0 1-11.13 11.13z" fill="url(#python-gradient-2)"/>
          </svg>
        </div>
        <div class="title-wrapper">
          <h1>Python 游戏化学习</h1>
          <p class="subtitle">以沉浸式游戏体验掌握Python编程</p>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-number" id="totalLevels">10</span>
          <span class="stat-label">关卡</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="completedCount">0</span>
          <span class="stat-label">已完成</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="remainingCount">10</span>
          <span class="stat-label">待完成</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <section class="progress-section" aria-label="学习进度">
      <div class="progress-header">
        <h2>学习进度</h2>
        <span class="progress-percentage" id="progressPercentage">0%</span>
      </div>
      <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="完成进度">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-glow"></div>
      </div>
      <p class="progress-text" id="progressText">完成 0 / 10 个关卡</p>
    </section>
    
    <section class="game-section" aria-label="游戏关卡">
      <div class="section-header">
        <h2>
          <svg class="section-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          选择关卡
        </h2>
      </div>
      
      <!-- 阶段标签导航 -->
      <div class="phase-tabs" id="phaseTabs" role="tablist" aria-label="阶段导航">
        <button class="phase-tab active" data-phase="1" role="tab" aria-selected="true">
          <span class="phase-icon">🏠</span>
          <span class="phase-name">新手村</span>
          <span class="phase-badge">1-5</span>
        </button>
        <button class="phase-tab" data-phase="2" role="tab" aria-selected="false">
          <span class="phase-icon">⚔️</span>
          <span class="phase-name">冒险启程</span>
          <span class="phase-badge">6-10</span>
        </button>
        <button class="phase-tab locked" data-phase="3" role="tab" aria-selected="false">
          <span class="phase-icon">🛡️</span>
          <span class="phase-name">技能进阶</span>
          <span class="phase-badge">11-15</span>
        </button>
        <button class="phase-tab locked" data-phase="4" role="tab" aria-selected="false">
          <span class="phase-icon">🏆</span>
          <span class="phase-name">挑战大师</span>
          <span class="phase-badge">16-20</span>
        </button>
        <button class="phase-tab locked" data-phase="5" role="tab" aria-selected="false">
          <span class="phase-icon">🔍</span>
          <span class="phase-name">探索者</span>
          <span class="phase-badge">21-25</span>
        </button>
        <button class="phase-tab locked" data-phase="6" role="tab" aria-selected="false">
          <span class="phase-icon">👑</span>
          <span class="phase-name">大师之路</span>
          <span class="phase-badge">26-30</span>
        </button>
      </div>
      
      <div class="level-selector" id="levelSelector" role="tablist" aria-label="关卡列表">
      </div>
      
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-info">
        <p>&copy; 2026 Python游戏化学习平台 · 由热爱编程的学习者精心打造</p>
      </div>
      <div class="footer-links">
        <a href="#" class="footer-link">使用指南</a>
        <span class="footer-divider">·</span>
        <a href="#" class="footer-link">常见问题</a>
        <span class="footer-divider">·</span>
        <a href="#" class="footer-link">关于作者</a>
      </div>
    </div>
  </footer>
  
  <script src="js/game.js"></script>
</body>
</html>
